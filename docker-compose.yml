services:
  api:
    build: ./api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: file:/app/data/dev.db
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - api-data:/app/data

  web:
    build:
      context: ./web
      args:
        # Baked in at build time; this is the address the *browser* uses to reach the API.
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  api-data:
